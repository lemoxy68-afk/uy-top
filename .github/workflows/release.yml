name: Release AAB (Play Market)
on:
  workflow_dispatch:
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Ikonkalar
        run: cp -r icons/res/* android/app/src/main/res/
      - run: npx cap sync android
      - name: Version (har yuklashda oshadi)
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build AAB
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cp android/app/build/outputs/bundle/release/app-release.aab uytop-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" uytop-release.aab "$KEY_ALIAS"
          jarsigner -verify uytop-release.aab | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: uytop-aab
          path: uytop-release.aab
